<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f1c6b8">
  <meta name="description" content="Transformez une carte Mercator en Eckert IV, puis enroulez-la sur un globe interactif.">
  <title>Correct the map</title>
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <main class="stage" id="stageShell">
    <canvas id="map" aria-label="Carte interactive : projection Mercator vers Eckert IV"></canvas>
    <section class="controls" aria-label="Commandes cartographiques">
      <div class="message" aria-live="polite"><span>correct</span><span>the map</span></div>
      <div class="slider-row">
        <span aria-hidden="true">Mercator</span>
        <label class="sr-only" for="morph">Transition Mercator vers Eckert IV</label>
        <input id="morph" type="range" min="0" max="100" value="0">
        <span aria-hidden="true">Eckert IV</span>
        <output id="morphValue" for="morph">0 %</output>
      </div>
      <button id="wrap" type="button" aria-pressed="false">
        <span class="globe-icon" aria-hidden="true">◉</span>
        <span class="button-label">wrap globe</span>
      </button>
    </section>
  </main>
  <script src="map.js"></script>
</body>
</html>
